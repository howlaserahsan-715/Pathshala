name = "pathshala"
compatibility_date = "2026-11-01"
pages_build_output_dir = "dist"

# D1 database binding. The real database_id is filled in by
# `npx wrangler d1 create pathshala-db` (or the Cloudflare dashboard).
[[d1_databases]]
binding = "DB"
database_name = "pathshala-db"
database_id = "b960df13-f1ed-458f-ab09-8004504a80c2"

[vars]
# Comma separated emails that always register as super admin.
SUPERADMIN_EMAILS = "creativeteamoperation@gmail.com"
GEMINI_MODEL = "gemini-2.5-flash"

# Add secrets with:
#   npx wrangler pages secret put GEMINI_API_KEY --project-name pathshala
